<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0a0f1e">
  <title>Staff Login — Subhan Care HMS</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/login.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%231e40af'/><text x='16' y='23' text-anchor='middle' fill='white' font-size='20' font-weight='bold'>+</text></svg>">
</head>
<body class="login-body">
  <!-- Ambient glow decorations -->
  <div class="login-orb login-orb-1" aria-hidden="true"></div>
  <div class="login-orb login-orb-2" aria-hidden="true"></div>
  <div class="login-grid" aria-hidden="true"></div>

  <main class="login-page">
    <div class="login-card">
      <div class="login-header">
        <div class="brand-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round">
            <path d="M12 5v14M5 12h14"/>
          </svg>
        </div>
        <h1>Subhan Care HMS</h1>
        <p>Staff Portal — Sign in to your account</p>
      </div>

      <div id="loginError" class="login-error hidden" role="alert"></div>

      <form id="loginForm" class="login-form" novalidate>
        <div class="form-field">
          <label for="username">Username</label>
          <div class="input-wrap">
            <svg class="input-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
              <circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6"/>
            </svg>
            <input type="text" id="username" name="username" required
                   placeholder="Enter your username" autocomplete="username" spellcheck="false">
          </div>
        </div>

        <div class="form-field">
          <label for="password">Password</label>
          <div class="input-wrap">
            <svg class="input-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
              <rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>
            </svg>
            <input type="password" id="password" name="password" required
                   placeholder="Enter your password" autocomplete="current-password">
            <button type="button" class="pw-toggle" id="pwToggle" aria-label="Show password" tabindex="-1">
              <svg class="eye eye-open" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6-10-6-10-6Z"/><circle cx="12" cy="12" r="2.6"/>
              </svg>
              <svg class="eye eye-off" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="display:none">
                <path d="M3 3l18 18"/><path d="M10.6 5.1A9.8 9.8 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-3.2 4M6.6 6.6C3.8 8.3 2 12 2 12s3.5 7 10 7c1.6 0 3-.4 4.2-1"/>
              </svg>
            </button>
          </div>
        </div>

        <div class="login-options">
          <label class="remember">
            <input type="checkbox" id="rememberMe">
            <span class="checkmark"></span>
            <span>Remember me</span>
          </label>
          <span class="login-hint">Default: admin / admin123</span>
        </div>

        <button type="submit" class="btn btn-primary btn-lg w-full" id="loginButton">
          <span class="btn-label">Sign In to HMS</span>
          <span class="btn-spinner" aria-hidden="true"></span>
        </button>
      </form>

      <div class="login-footer">
        <a href="/" class="back-link">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 12H5M12 19l-7-7 7-7"/>
          </svg>
          Back to AI Receptionist
        </a>
      </div>
    </div>
  </main>

  <script type="module" src="/js/login.js"></script>
</body>
</html>
