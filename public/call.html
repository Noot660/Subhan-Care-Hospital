<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Voice Call — Subhan Care AI</title>
  <link rel="stylesheet" href="/css/call.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%231e40af'/><text x='16' y='22' text-anchor='middle' fill='white' font-size='16' font-weight='bold'>+</text></svg>">
</head>
<body>

  <!-- Top bar -->
  <header class="top-bar">
    <a href="/" class="back-link" title="Chat" aria-label="Switch to chat">💬 Chat</a>
    <div class="brand">
      <span class="brand-icon">+</span>
      <span class="brand-text">Subhan Care AI</span>
      <span class="connection-dot" id="connectionDot" title="Connected"></span>
    </div>
    <button class="lang-toggle" id="langToggle" aria-label="Switch language">EN | <span class="lang-inactive">UR</span></button>
  </header>

  <!-- Main area -->
  <main class="main-area">

    <!-- Voice capability notice (shown when the Web Speech API is unavailable) -->
    <div class="voice-notice" id="voiceNotice" hidden role="status">
      <span class="voice-notice-icon">🎧</span>
      <div class="voice-notice-text">
        <strong id="voiceNoticeTitle">Voice calling isn't supported in this browser</strong>
        <span id="voiceNoticeBody">This browser does not support the Web Speech API. No problem — type your message below instead.</span>
      </div>
      <a class="voice-notice-link" id="voiceNoticeLink" href="/" aria-label="Open Chat">💬 Open Chat</a>
    </div>

    <!-- Orb -->
    <div class="orb-container" id="orbContainer">
      <div class="orb-glow" id="orbGlow"></div>
      <div class="orb-ring ring-1" id="ring1"></div>
      <div class="orb-ring ring-2" id="ring2"></div>
      <div class="orb-ring ring-3" id="ring3"></div>
      <div class="audio-bars" id="audioBars"><span></span><span></span><span></span><span></span><span></span></div>
      <div class="orb-core" id="orbCore">
        <svg class="orb-mic-icon" id="orbMicIcon" viewBox="0 0 24 24" width="36" height="36" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
          <line x1="12" y1="19" x2="12" y2="23"/>
          <line x1="8" y1="23" x2="16" y2="23"/>
        </svg>
      </div>
    </div>

    <!-- Status text -->
    <p class="status-text" id="statusText">Tap the mic to speak</p>

    <!-- Quick action chips -->
    <div class="quick-chips" id="quickChips"></div>

    <!-- Transcript area -->
    <div class="transcript-area" id="transcriptArea">
      <div class="transcript-msg transcript-user" id="transcriptUser"></div>
      <div class="transcript-msg transcript-ai" id="transcriptAI"></div>
    </div>

    <!-- Text input (hidden by default) -->
    <div class="text-fallback" id="textFallback" style="display:none;">
      <input type="text" id="textInput" class="text-input" placeholder="Type your message..." autocomplete="off" maxlength="300">
      <button class="text-send-btn" id="textSendBtn" aria-label="Send">➤</button>
    </div>

  </main>

  <!-- Bottom controls -->
  <footer class="bottom-bar">
    <div class="mic-area">
      <!-- Mode toggle (small) -->
      <button class="mode-toggle" id="modeToggle" title="Switch to Auto mode">
        <span class="mode-badge">Tap</span>
      </button>

      <!-- Big mic button -->
      <button class="mic-btn" id="micBtn" aria-label="Tap to speak" title="Tap to speak">
        <svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
          <line x1="12" y1="19" x2="12" y2="23"/>
          <line x1="8" y1="23" x2="16" y2="23"/>
        </svg>
      </button>

      <!-- Mute toggle -->
      <button class="mute-btn" id="muteBtn" aria-label="Mute">🔊</button>

      <!-- Speaker toggle -->
      <button class="speaker-btn" id="speakerBtn" aria-label="Speaker">📢</button>

      <!-- Type instead -->
      <button class="type-btn" id="typeBtn" aria-label="Type instead">⌨</button>

      <!-- End call -->
      <button class="end-btn" id="endBtn" aria-label="End call" title="End call">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
          <path d="M6.62 10.79a15.05 15.05 0 0 0 6.59 6.59l2.2-2.2a1 1 0 0 1 1.02-.24 11.36 11.36 0 0 0 3.57.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1 11.36 11.36 0 0 0 .57 3.57 1 1 0 0 1-.25 1.02l-2.2 2.2z" transform="rotate(135 12 12)"/>
        </svg>
      </button>
    </div>

    <!-- Call timer -->
    <div class="call-timer" id="callTimer">00:00</div>
  </footer>

  <script type="module" src="/js/call.js"></script>
</body>
</html>
