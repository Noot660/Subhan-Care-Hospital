<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Call — Subhan Care AI Receptionist</title>
  <link rel="stylesheet" href="/css/call.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%231e40af'/><text x='16' y='22' text-anchor='middle' fill='white' font-size='18'>📞</text></svg>">
</head>
<body>
  <!-- Chat navigation -->
  <nav class="call-nav">
    <a href="/" title="Switch to Chat">💬 Chat</a>
  </nav>

  <!-- Main call container -->
  <div class="call-container" id="callContainer">

    <!-- Mic permission prompt (shown initially) -->
    <div class="mic-prompt visible" id="micPrompt">
      <div class="mic-icon">🎤</div>
      <h2>Microphone Access</h2>
      <p>Subhan Care uses your microphone to speak with our AI receptionist. Your voice is processed in real-time.</p>
      <button class="btn btn-primary" id="micAllowBtn">🎤 Allow Microphone</button>
    </div>

    <!-- Active call UI (hidden initially) -->
    <div id="callUI" style="display:none; flex-direction:column; align-items:center; width:100%; height:100%; justify-content:space-between;">

      <!-- Caller ID -->
      <div class="caller-id">
        <div class="name">Subhan Care AI Receptionist</div>
        <div class="label">Incoming call — Connected</div>
      </div>

      <!-- Timer -->
      <div class="call-timer" id="callTimer">00:00</div>

      <!-- Phone Icon with pulse -->
      <div class="phone-icon-wrap">
        <div class="pulse-ring"></div>
        <div class="pulse-ring"></div>
        <div class="pulse-ring"></div>
        <div class="phone-icon" id="phoneIcon">📞</div>
      </div>

      <!-- Status -->
      <div class="call-status">
        <div class="status-text" id="statusText">Connecting...</div>
        <div class="waveform" id="waveform" style="display:none;">
          <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
        </div>
        <div class="listening-dots" id="listeningDots" style="display:none;">
          <span></span><span></span><span></span>
        </div>
      </div>

      <!-- Call summary (shown after hangup) -->
      <div class="call-summary" id="callSummary">
        <h3>Call Summary</h3>
        <p id="callSummaryText"></p>
      </div>

      <!-- Transcript preview -->
      <div class="transcript-preview" id="transcriptPreview"></div>

      <!-- Error -->
      <div class="call-error" id="callError"></div>

      <!-- Bottom -->
      <div class="call-bottom">
        <div class="call-actions">
          <button class="call-lang-toggle" id="langToggle" title="Switch language">اردو</button>
        </div>
        <button class="btn-end" id="endCallBtn" title="End Call">
          <span style="transform: rotate(135deg); display: inline-block;">📞</span>
        </button>
        <div class="end-label">End Call</div>
      </div>
    </div>

    <!-- Post-call UI (hidden) -->
    <div id="postCallUI" style="display:none; flex-direction:column; align-items:center; gap:24px; text-align:center; width:100%;">
      <div style="font-size:3rem;">📞</div>
      <h2 style="color:#e0e0e0; font-size:1.2rem;">Call Ended</h2>
      <div class="call-summary visible" id="postCallSummary">
        <h3>Call Summary</h3>
        <p id="postCallSummaryText"></p>
      </div>
      <div style="display:flex; gap:12px; flex-wrap:wrap; justify-content:center;">
        <button class="btn btn-primary" id="recallBtn">🔄 Call Again</button>
        <a href="/" class="btn btn-retry" style="text-decoration:none;">💬 Open Chat</a>
      </div>
    </div>

  </div>

  <script type="module" src="/js/call.js"></script>
</body>
</html>
