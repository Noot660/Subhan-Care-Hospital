<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0a0f1e">
  <title>Dashboard — Subhan Care HMS</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/dashboard.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%231e40af'/><text x='16' y='23' text-anchor='middle' fill='white' font-size='20' font-weight='bold'>+</text></svg>">
</head>
<body class="dash-body">
  <div class="dash-app">

    <!-- ── Sidebar ── -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <div class="brand-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round">
            <path d="M12 5v14M5 12h14"/>
          </svg>
        </div>
        <div class="brand-text">
          <span>Subhan Care</span>
          <small>HMS</small>
        </div>
      </div>

      <nav class="sidebar-nav" id="sidebarNav" aria-label="Primary navigation"></nav>

      <div class="sidebar-user">
        <div class="user-avatar" id="userAvatar">?</div>
        <div class="user-meta">
          <span class="user-name" id="userNameDisplay">—</span>
          <span class="user-role" id="userRoleDisplay">—</span>
        </div>
        <button class="logout-btn" id="logoutButton" title="Sign out" aria-label="Sign out">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>
          </svg>
        </button>
      </div>
    </aside>

    <!-- ── Main ── -->
    <div class="dash-main">
      <header class="top-bar">
        <button class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle sidebar">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M4 6h16M4 12h16M4 18h16"/>
          </svg>
        </button>
        <div class="topbar-titles">
          <div class="breadcrumb" id="breadcrumb">HMS</div>
          <h2 class="page-title" id="dashboardTitle">Dashboard</h2>
        </div>
        <div class="topbar-right">
          <span class="updated-indicator" id="updatedIndicator" hidden>
            <span class="dot"></span> Updated just now
          </span>
          <div class="topbar-user">
            <span class="topbar-name" id="topbarName">—</span>
            <div class="user-avatar small" id="topbarAvatar">?</div>
          </div>
        </div>
      </header>

      <main class="page-content" id="dashboardContent" tabindex="-1"></main>
    </div>

    <!-- ── Mobile bottom tab bar ── -->
    <nav class="bottom-tabs" id="bottomTabs" aria-label="Section navigation"></nav>
  </div>

  <script type="module" src="/js/dashboard.js"></script>
</body>
</html>
